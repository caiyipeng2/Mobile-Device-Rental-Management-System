name: ci

on:
  push:
    branches:
      - codex/mobile-device-rental-system
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget/packages

jobs:
  build-unit:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.7.0
          cache: npm

      - name: Verify local prerequisites
        shell: pwsh
        run: pwsh eng/Verify-Prerequisites.ps1 -Mode LocalUnit

      - name: Verify CI pinning and jobs
        shell: pwsh
        run: pwsh eng/Verify-CiSkeleton.ps1

      - name: Restore .NET dependencies
        shell: pwsh
        run: pwsh eng/dotnet.ps1 restore --locked-mode

      - name: Restore frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Build solution
        shell: pwsh
        run: pwsh eng/dotnet.ps1 build --configuration Release --no-restore

      - name: Verify committed migration SQL
        shell: pwsh
        run: pwsh eng/Verify-MigrationArtifact.ps1

      - name: Run full unit suite with Microsoft Testing Platform
        shell: pwsh
        run: >-
          pwsh eng/dotnet.ps1 test
          --project tests/DeviceRental.UnitTests/DeviceRental.UnitTests.csproj
          --configuration Release
          --no-build
          --minimum-expected-tests 90
          --results-directory artifacts/test-results
          --report-xunit-trx
          --report-xunit-trx-filename unit-mtp.trx
          --coverage
          --coverage-output artifacts/test-results/coverage.cobertura.xml
          --coverage-output-format cobertura
          --output Detailed

      - name: Run Web health fail-closed tests with Microsoft Testing Platform
        shell: pwsh
        run: >-
          pwsh eng/dotnet.ps1 test
          --project tests/DeviceRental.WebTests/DeviceRental.WebTests.csproj
          --configuration Release
          --no-build
          --minimum-expected-tests 3
          --fail-skips on
          --results-directory artifacts/test-results/web-health
          --report-xunit-trx
          --report-xunit-trx-filename web-health.trx
          --output Detailed

      - name: Upload unit-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-evidence
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 14

  integration:
    name: PostgreSQL 18 database specifications
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEVICERENTAL_TEST_POSTGRES_ADMIN: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=device-rental-test-only
      DEVICERENTAL_SAFE_DIAGNOSTICS_DIRECTORY: ${{ github.workspace }}/artifacts/integration-results/database
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: device-rental-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Verify PostgreSQL test prerequisites
        shell: pwsh
        env:
          DEVICERENTAL_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: pwsh eng/Verify-Prerequisites.ps1 -Mode Database

      - name: Restore locked dependencies
        shell: pwsh
        run: pwsh eng/dotnet.ps1 restore tests/DeviceRental.IntegrationTests/DeviceRental.IntegrationTests.csproj --locked-mode

      - name: Restore PostgreSQL provider guard dependencies
        shell: pwsh
        run: pwsh eng/dotnet.ps1 restore tests/DeviceRental.UnitTests/DeviceRental.UnitTests.csproj --locked-mode

      - name: Build integration test assembly
        shell: pwsh
        run: pwsh eng/dotnet.ps1 build tests/DeviceRental.IntegrationTests/DeviceRental.IntegrationTests.csproj --configuration Release --no-restore

      - name: Build PostgreSQL provider guard assembly
        shell: pwsh
        run: pwsh eng/dotnet.ps1 build tests/DeviceRental.UnitTests/DeviceRental.UnitTests.csproj --configuration Release --no-restore

      - name: Run PostgreSQL provider guard tests
        shell: pwsh
        run: >-
          pwsh eng/dotnet.ps1 test
          --project tests/DeviceRental.UnitTests/DeviceRental.UnitTests.csproj
          --configuration Release
          --no-build
          --filter-namespace DeviceRental.UnitTests.Architecture
          --minimum-expected-tests 9
          --results-directory artifacts/integration-results/provider-guard
          --report-xunit-trx
          --report-xunit-trx-filename provider-guard.trx
          --output Detailed

      - name: Run PostgreSQL database specifications
        shell: pwsh
        run: |
          $safeSqlStatePath = 'artifacts/integration-results/database/sqlstate-diagnostics.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $safeSqlStatePath) | Out-Null
          $testOutput = @(
              & pwsh eng/dotnet.ps1 test `
                  --project tests/DeviceRental.IntegrationTests/DeviceRental.IntegrationTests.csproj `
                  --configuration Release `
                  --no-build `
                  --filter Category=Database `
                  --minimum-expected-tests 26 `
                  --fail-skips on `
                  --results-directory artifacts/integration-results/database `
                  --report-xunit-trx `
                  --report-xunit-trx-filename postgres-database.trx `
                  --output Detailed 2>&1
          )
          $exitCode = $LASTEXITCODE
          $sqlStates = [regex]::Matches(
              ($testOutput -join "`n"),
              '\b(?:22|23|25|28|42)[0-9A-Z]{3}\b') |
              ForEach-Object Value |
              Sort-Object -Unique
          $sqlStates | Set-Content -LiteralPath $safeSqlStatePath

          $categories = [System.Collections.Generic.HashSet[string]]::new()
          foreach ($line in $testOutput) {
              if ($line -match '(?i)connection|socket|timeout') { [void]$categories.Add('CONNECTION') }
              if ($line -match '(?i)permission|privilege|access denied') { [void]$categories.Add('PRIVILEGE') }
              if ($line -match '(?i)schema|relation|table|column|migration') { [void]$categories.Add('SCHEMA') }
              if ($line -match '(?i)assert|expected|actual|test failed') { [void]$categories.Add('ASSERTION') }
              if ($line -match '(?i)postgres|npgsql|sqlstate') { [void]$categories.Add('PROVIDER') }
          }
          $categories | Set-Content -LiteralPath 'artifacts/integration-results/database/safe-output-categories.txt'
          foreach ($line in $testOutput) {
              if ($line -match '^SAFE-DIAGNOSTIC\|([A-Za-z0-9_.:-]+)\|([A-Za-z0-9_.:-]+)\|([A-Za-z0-9_.:-]+)$') {
                  Write-Output "::error title=Database safe diagnostic::$($Matches[1])|$($Matches[2])|$($Matches[3])"
              }
          }
          exit $exitCode

      - name: Publish database test failures
        if: failure()
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -LiteralPath artifacts/integration-results/database -Recurse -Filter '*.trx' -File -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
              Write-Output '::error title=Database test diagnostics::No TRX report was produced.'
              exit 0
          }

          foreach ($report in $reports) {
              [xml]$document = Get-Content -LiteralPath $report.FullName -Raw
              $failed = @($document.TestRun.Results.UnitTestResult | Where-Object {
                  $_.outcome -notin @('Passed', 'NotExecuted')
              })
              foreach ($result in $failed) {
                  # Publish only the test name, outcome, and a SQLSTATE class/code if present.
                  # Raw stack traces and provider messages can contain paths or data.
                  $serializedResult = $result.OuterXml
                  $sqlState = [regex]::Match($serializedResult, '\b(?:22|23|25|28|42)[0-9A-Z]{3}\b').Value
                  $detail = if ([string]::IsNullOrWhiteSpace($sqlState)) { 'SQLSTATE unavailable' } else { "SQLSTATE $sqlState" }
                  if ($detail -eq 'SQLSTATE unavailable') {
                      if ($serializedResult -match '(?i)PostgresException') { $detail = 'exception POSTGRES' }
                      elseif ($serializedResult -match '(?i)NpgsqlException') { $detail = 'exception NPGSQL' }
                      elseif ($serializedResult -match '(?i)SocketException') { $detail = 'exception SOCKET' }
                      elseif ($serializedResult -match '(?i)ExpectedExceptionNotRaised|Expected PostgreSQL exception') { $detail = 'exception EXPECTED_NOT_RAISED' }
                      elseif ($serializedResult -match '(?i)authentication|password') { $detail = 'category AUTHENTICATION' }
                      elseif ($serializedResult -match '(?i)privilege|permission|access denied') { $detail = 'category PRIVILEGE' }
                      elseif ($serializedResult -match '(?i)connection|socket|timeout') { $detail = 'category CONNECTION' }
                      elseif ($serializedResult -match '(?i)schema|relation|table|column|migration') { $detail = 'category SCHEMA' }
                      elseif ($serializedResult -match '(?i)assert|expected|actual') { $detail = 'category ASSERTION' }
                      elseif ($serializedResult -match '(?i)postgres|npgsql') { $detail = 'category PROVIDER' }
                  }
                  Write-Output "::error title=Database test failure::$($result.testName) - outcome: $($result.outcome); $detail"
              }
          }

          $safeDiagnosticPath = 'artifacts/integration-results/database/safe-diagnostics.txt'
          if (Test-Path -LiteralPath $safeDiagnosticPath -PathType Leaf) {
              foreach ($line in Get-Content -LiteralPath $safeDiagnosticPath) {
                  Write-Output "::error title=Database setup classification::$line"
              }
          }

          $safeSqlStatePath = 'artifacts/integration-results/database/sqlstate-diagnostics.txt'
          if (Test-Path -LiteralPath $safeSqlStatePath -PathType Leaf) {
              foreach ($sqlState in Get-Content -LiteralPath $safeSqlStatePath) {
                  if (-not [string]::IsNullOrWhiteSpace($sqlState)) {
                      Write-Output "::error title=Database SQLSTATE observed::SQLSTATE $sqlState"
                  }
              }
          }

          $safeAssertionPath = 'artifacts/integration-results/database/sqlstate-assertions.txt'
          if (Test-Path -LiteralPath $safeAssertionPath -PathType Leaf) {
              foreach ($assertion in Get-Content -LiteralPath $safeAssertionPath) {
                  if (-not [string]::IsNullOrWhiteSpace($assertion)) {
                      Write-Output "::error title=Database assertion classification::$assertion"
                  }
              }
          }

          $connectionDiagnosticPath = 'artifacts/integration-results/database/connection-diagnostics.txt'
          if (Test-Path -LiteralPath $connectionDiagnosticPath -PathType Leaf) {
              foreach ($line in Get-Content -LiteralPath $connectionDiagnosticPath) {
                  if (-not [string]::IsNullOrWhiteSpace($line)) {
                      Write-Output "::error title=Database connection classification::$line"
                  }
              }
          }

          $exceptionDiagnosticPath = 'artifacts/integration-results/database/exception-diagnostics.txt'
          if (Test-Path -LiteralPath $exceptionDiagnosticPath -PathType Leaf) {
              foreach ($line in Get-Content -LiteralPath $exceptionDiagnosticPath) {
                  if (-not [string]::IsNullOrWhiteSpace($line)) {
                      Write-Output "::error title=Database exception classification::$line"
                  }
              }
          }

          $safeCategoryPath = 'artifacts/integration-results/database/safe-output-categories.txt'
          if (Test-Path -LiteralPath $safeCategoryPath -PathType Leaf) {
              foreach ($category in Get-Content -LiteralPath $safeCategoryPath) {
                  if (-not [string]::IsNullOrWhiteSpace($category)) {
                      Write-Output "::error title=Database output category::$category"
                  }
              }
          }


      - name: Upload integration-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-evidence
          path: artifacts/integration-results
          if-no-files-found: error
          retention-days: 14
